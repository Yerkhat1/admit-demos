<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplitSecond — таным зертханасы</title>
<style>
  :root{ --ink:#f5f3ff; --muted:#b9b4e0; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.16);
         --ok:#22d39a; --bad:#ff5a6a; --accent:#7c6cff; --accent2:#3aa0ff; --magenta:#ff5db1;
         --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
         --grad:linear-gradient(135deg,#7c6cff 0%,#4a8bff 55%,#33c9ff 100%);
         --grad-mag:linear-gradient(135deg,#ff5db1 0%,#7c6cff 100%);
         --red:#e5484d; --blue:#3aa0ff; --green:#30a46c; --yellow:#f5d90a; --purple:#a77bf3; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);
       line-height:1.5;font-size:16px;min-height:100vh;
       background:
         radial-gradient(1100px 620px at 12% -8%, #4a2fae 0%, transparent 58%),
         radial-gradient(1000px 680px at 102% 2%, #b3308a 0%, transparent 52%),
         radial-gradient(900px 700px at 50% 120%, #1f6bd6 0%, transparent 55%),
         linear-gradient(165deg,#180f38 0%,#130b2c 48%,#0e1030 100%);
       background-attachment:fixed;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes glowpulse{0%,100%{box-shadow:0 0 0 0 rgba(124,108,255,.0)}50%{box-shadow:0 0 34px 2px rgba(124,108,255,.35)}}
  header{padding:20px 30px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .brand{font-weight:800;font-size:24px;letter-spacing:.2px;cursor:pointer;
         background:linear-gradient(90deg,#fff, #d9d2ff 60%, #a9c7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{display:block;font-weight:500;font-size:13px;color:var(--muted);max-width:640px;-webkit-text-fill-color:var(--muted)}
  .lang button{background:var(--glass);border:1px solid var(--line);color:var(--muted);
       padding:8px 14px;border-radius:99px;cursor:pointer;font-weight:700;margin-left:8px;font-size:14px;transition:.15s}
  .lang button:hover{color:var(--ink);border-color:var(--line2)}
  .lang button.active{color:#fff;border-color:transparent;background:var(--grad);box-shadow:0 6px 18px -6px rgba(124,108,255,.7)}
  body[data-screen="task"] .lang{visibility:hidden}      /* keep language stable mid-run */
  main{max-width:980px;margin:0 auto;padding:30px 20px 72px}
  .screen{display:none}
  body[data-screen="hub"]     #hub,
  body[data-screen="intro"]   #intro,
  body[data-screen="task"]    #task,
  body[data-screen="results"] #results,
  body[data-screen="profile"] #profile{display:block}
  .card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:26px 28px;margin-bottom:18px;
        backdrop-filter:blur(14px);box-shadow:0 24px 60px -30px rgba(0,0,0,.7);animation:fadeUp .45s ease both}
  h2{margin:0 0 12px;font-size:26px;font-weight:800;letter-spacing:-.3px}
  .lead{color:var(--muted);font-size:15px;margin:0 0 8px}
  ul.how{color:var(--ink);font-size:15px;margin:12px 0 0;padding-left:20px}
  ul.how li{margin:7px 0}
  .btn{padding:16px 30px;border-radius:16px;border:none;background:var(--grad);
       color:#fff;font-weight:800;cursor:pointer;font-size:17px;letter-spacing:.2px;
       box-shadow:0 14px 30px -12px rgba(124,108,255,.8);transition:transform .12s,filter .12s,box-shadow .12s}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 20px 40px -14px rgba(124,108,255,.9)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn.ghost{background:var(--glass2);color:var(--ink);box-shadow:none;border:1px solid var(--line2)}
  .btn.ghost:hover{background:rgba(255,255,255,.14);filter:none}
  .btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
  .btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;align-items:center}
  /* ---- HUB (the lab menu) ---- */
  .hub-intro{margin:4px 0 22px}
  .hub-intro h2{font-size:32px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  @media (max-width:640px){ .grid{grid-template-columns:1fr} }
  .tile{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:22px 24px;
        cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s,background .16s;
        display:flex;flex-direction:column;gap:6px;overflow:hidden;backdrop-filter:blur(12px);
        box-shadow:0 18px 44px -26px rgba(0,0,0,.75);animation:fadeUp .5s ease both}
  .tile::after{content:"";position:absolute;inset:0;border-radius:22px;padding:1px;pointer-events:none;
        background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 40%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.6}
  .grid .tile:nth-child(1){animation-delay:.02s} .grid .tile:nth-child(2){animation-delay:.08s}
  .grid .tile:nth-child(3){animation-delay:.14s} .grid .tile:nth-child(4){animation-delay:.2s}
  .tile:hover{transform:translateY(-4px) scale(1.012);border-color:var(--line2);
        background:rgba(255,255,255,.09);box-shadow:0 28px 60px -26px rgba(124,108,255,.55)}
  .tile .top{display:flex;align-items:center;gap:14px}
  .tile .ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;
        justify-content:center;font-size:27px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .tile h3{margin:0;font-size:20px;font-weight:800}
  .tile .measures{color:var(--muted);font-size:13px;font-weight:700}
  .tile p{color:var(--muted);font-size:14px;margin:8px 0 0}
  .tile .done{color:var(--ok);font-size:13px;font-weight:800;margin-top:8px}
  .profile-cta{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  /* ---- Setup controls (intro) ---- */
  .setup{margin-top:20px;border-top:1px solid var(--line);padding-top:18px}
  .setup .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
  .setup .label{color:var(--muted);font-size:14px;min-width:104px;font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--glass)}
  .seg button{background:transparent;border:none;color:var(--muted);padding:10px 18px;
       cursor:pointer;font-weight:700;font-size:14px;border-right:1px solid var(--line);transition:.12s}
  .seg button:last-child{border-right:none}
  .seg button.active{background:var(--grad);color:#fff}
  .check{display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink);font-size:15px;user-select:none}
  .check input{width:19px;height:19px;accent-color:var(--accent);cursor:pointer}
  /* ---- Task shell ---- */
  .pbar{height:10px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
  .pbar-fill{height:100%;width:0;background:var(--grad);transition:width .25s;box-shadow:0 0 16px rgba(124,108,255,.7)}
  .progress{color:var(--muted);font-size:15px;margin-bottom:14px;text-align:center;min-height:22px;font-weight:600}
  .progress .badge{display:inline-block;background:var(--grad-mag);color:#fff;border:none;
       border-radius:99px;padding:2px 12px;font-size:12px;font-weight:800;margin-left:8px}
  .stage{height:270px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
         background:linear-gradient(180deg,#ffffff,#f1eeff);border-radius:26px;border:1px solid rgba(255,255,255,.5);
         margin-bottom:18px;user-select:none;position:relative;box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
  .stage.dark{background:linear-gradient(180deg,#241a52,#171036);border-color:var(--line2)}
  .stage.wait{background:linear-gradient(180deg,#5a1f34,#3a1730)}   /* RT: waiting */
  .stage.go{background:linear-gradient(180deg,#0f7a52,#0c5f52)}     /* RT: go */
  .word{font-size:78px;font-weight:900;letter-spacing:1px}
  .fix{font-size:54px;color:#a99fd6;font-weight:800}
  .count{font-size:96px;font-weight:900;color:#1a1147}
  .shape{width:140px;height:140px;box-shadow:0 12px 40px -8px rgba(0,0,0,.5)}
  .shape.circle{border-radius:50%}
  .bigmsg{font-size:44px;font-weight:900;letter-spacing:.5px}
  .bigmsg.w{color:#ffc0c8}
  .bigmsg.g{color:#8ff5cf}
  .digits{font-size:100px;font-weight:900;color:#1a1147;font-variant-numeric:tabular-nums;letter-spacing:6px}
  .seqentry{font-size:56px;font-weight:900;color:#1a1147;letter-spacing:12px;min-height:68px;font-variant-numeric:tabular-nums}
  .stage.flash-ok{box-shadow:inset 0 0 0 6px var(--ok),0 30px 70px -30px rgba(0,0,0,.7);animation:pop .3s ease}
  .stage.flash-bad{box-shadow:inset 0 0 0 6px var(--bad),0 30px 70px -30px rgba(0,0,0,.7);animation:pop .3s ease}
  .controls{min-height:20px}
  .answers{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .answers button{height:92px;border-radius:18px;border:3px solid rgba(255,255,255,.22);
       cursor:pointer;position:relative;font-weight:900;font-size:20px;color:rgba(0,0,0,.55);
       transition:transform .1s,filter .1s;box-shadow:0 12px 26px -12px rgba(0,0,0,.6)}
  .answers button:hover{filter:brightness(1.08)} .answers button:active{transform:scale(.95)}
  .answers button:disabled{cursor:default}
  .answers button .k{position:absolute;top:7px;left:11px;font-size:13px;color:rgba(0,0,0,.5)}
  .bigbtn{display:block;width:100%;height:96px;border-radius:20px;border:none;background:var(--grad);
       color:#fff;font-weight:900;font-size:23px;letter-spacing:.5px;cursor:pointer;
       box-shadow:0 18px 40px -14px rgba(124,108,255,.85);transition:transform .1s,filter .1s}
  .bigbtn:hover{filter:brightness(1.07)} .bigbtn:active{transform:scale(.98)}
  .bigbtn:disabled{opacity:.45;cursor:default}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:360px;margin:0 auto}
  .keypad button{height:68px;border-radius:16px;border:1px solid var(--line2);background:var(--glass2);
       color:var(--ink);font-weight:900;font-size:25px;cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .1s,background .12s}
  .keypad button:hover{background:rgba(255,255,255,.15)} .keypad button:active{transform:scale(.94)}
  .keypad button.wide{grid-column:span 1}
  .keypad button.act{background:var(--grad);color:#fff;border-color:transparent}
  .quit{display:block;margin:18px auto 0;background:transparent;border:none;color:var(--muted);
       cursor:pointer;font-size:13px;text-decoration:underline}
  /* ---- Results ---- */
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 4px}
  @media (max-width:640px){ .metrics{grid-template-columns:1fr} .answers{grid-template-columns:repeat(2,1fr)} }
  .metric{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center;
       backdrop-filter:blur(8px);animation:pop .35s ease both}
  .metric .v{font-size:34px;font-weight:900;letter-spacing:-.5px}
  .metric .l{color:var(--muted);font-size:13px;margin-top:5px;font-weight:600}
  .metric.head{border-color:transparent;background:var(--grad);box-shadow:0 18px 40px -18px rgba(124,108,255,.8)}
  .metric.head .v{color:#fff}
  .metric.head .l{color:rgba(255,255,255,.85)}
  .bars{margin:20px 0 4px}
  .bars .row{display:grid;grid-template-columns:120px 1fr 62px;align-items:center;gap:10px;margin:9px 0}
  .bars .name{color:var(--muted);font-size:13px;text-align:right;font-weight:600}
  .bars .track{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:99px;height:22px;overflow:hidden}
  .bars .fill{display:block;height:100%;border-radius:99px;min-width:2px;transition:width .5s}
  .bars .fill.con{background:linear-gradient(90deg,#22d39a,#30a46c)} .bars .fill.inc{background:linear-gradient(90deg,#ff5db1,#e5484d)}
  .bars .fill.a{background:var(--grad)} .bars .fill.p{background:linear-gradient(90deg,#a77bf3,#7c6cff)}
  .bars .val{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
  .interp{color:var(--muted);font-size:15px;margin-top:16px;line-height:1.6}
  .interp b{color:var(--ink)}
  .note{color:var(--muted);font-size:12px;margin-top:10px}
  .rtd{margin:20px 0 4px}
  .rtd-title{color:var(--muted);font-size:13px;margin-bottom:8px;font-weight:600}
  .rtd-chart{display:flex;align-items:flex-end;gap:5px;height:96px;
       background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .rtd-chart .bin{flex:1;background:var(--grad);border-radius:5px 5px 0 0;min-height:2px;opacity:.9;transition:height .3s}
  .rtd-axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px;font-variant-numeric:tabular-nums}
  details.sci{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  details.sci summary{cursor:pointer;color:#b6a9ff;font-weight:700;font-size:14px;list-style:none;user-select:none}
  details.sci summary::-webkit-details-marker{display:none}
  details.sci summary::before{content:"▸  "}
  details.sci[open] summary::before{content:"▾  "}
  details.sci .body{color:var(--muted);font-size:14px;margin-top:10px;line-height:1.65}
  details.sci .body b{color:var(--ink)}
  /* ---- Profile dashboard ---- */
  .prow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:16px;
        background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:11px 0;
        transition:transform .14s,background .14s,box-shadow .14s;animation:fadeUp .4s ease both}
  .prow:hover{transform:translateY(-2px);background:rgba(255,255,255,.09);box-shadow:0 20px 44px -26px rgba(124,108,255,.5)}
  .prow .ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;
        box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .prow .name{font-weight:800;font-size:16px}
  .prow .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .prow .val{text-align:right}
  .prow .val .n{font-size:27px;font-weight:900;letter-spacing:-.5px}
  .prow .val .band{color:var(--muted);font-size:12px;margin-top:2px}
  .prow.empty .val .n{color:var(--muted);font-size:15px;font-weight:700}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:26px;border-top:1px solid var(--line)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(30,20,60,.9);
         border:1px solid var(--line2);color:var(--ink);padding:12px 20px;border-radius:99px;
         font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;backdrop-filter:blur(10px)}
  .toast.show{opacity:1}
</style>
</head>
<body data-screen="hub">
<header>
  <div class="brand" id="brand">SplitSecond <small id="tagline"></small></div>
  <div class="lang">
    <button data-lang="kz" class="active">ҚАЗ</button>
    <button data-lang="ru">РУС</button>
  </div>
</header>
<main>
  <!-- HUB -->
  <section id="hub" class="screen">
    <div class="hub-intro">
      <h2 id="hubTitle"></h2>
      <p class="lead" id="hubLead"></p>
    </div>
    <div class="grid" id="tiles"></div>
    <div class="profile-cta">
      <button class="btn" id="openProfile"></button>
      <button class="btn ghost" id="hubDownload"></button>
    </div>
  </section>

  <!-- INTRO (per task) -->
  <section id="intro" class="screen">
    <div class="card">
      <h2 id="introTitle"></h2>
      <p class="lead" id="hook"></p>
      <ul class="how" id="how"></ul>
      <details class="sci"><summary id="sciSummary"></summary><div class="body" id="sciBody"></div></details>
      <div class="setup" id="setup"></div>
      <div class="btnrow">
        <button class="btn" id="start"></button>
        <button class="btn ghost" id="introBack"></button>
      </div>
    </div>
  </section>

  <!-- TASK -->
  <section id="task" class="screen">
    <div class="pbar"><div class="pbar-fill" id="pfill"></div></div>
    <div class="progress" id="progress"></div>
    <div class="stage" id="stage"></div>
    <div class="controls" id="controls"></div>
    <button class="quit" id="quit"></button>
  </section>

  <!-- RESULTS (per task) -->
  <section id="results" class="screen">
    <div class="card">
      <h2 id="resTitle"></h2>
      <div id="resBody"></div>
      <div class="btnrow">
        <button class="btn" id="again"></button>
        <button class="btn ghost" id="share"></button>
        <button class="btn ghost" id="download"></button>
        <button class="btn ghost" id="toHub"></button>
      </div>
    </div>
  </section>

  <!-- PROFILE -->
  <section id="profile" class="screen">
    <div class="card">
      <h2 id="profTitle"></h2>
      <p class="lead" id="profLead"></p>
      <div id="profRows"></div>
      <div class="note" id="profNote"></div>
      <div class="btnrow">
        <button class="btn" id="profDownload"></button>
        <button class="btn ghost" id="profBack"></button>
      </div>
    </div>
  </section>
</main>
<footer id="footer"></footer>
<div class="toast" id="toast"></div>
<canvas id="cardCanvas" width="1080" height="1080" style="display:none"></canvas>

<script>
/* SplitSecond — a browser-based COGNITIVE LAB for Alikhan's tech project.
   Four self-contained, from-scratch tasks (no libraries), each measuring a different mental
   function, all writing to one shared cognitive profile and one combined dataset (CSV):

     1) Stroop         — attention & conflict     (conflict cost = incongruent RT - congruent RT)
     2) Go / No-Go     — impulse control          (commission errors on the withhold trials)
     3) Reaction Time  — raw processing speed      (simple visual RT)
     4) Digit Span     — working-memory capacity   (longest sequence recalled)

   The point is not "a game" — it is a small instrument battery that lets someone collect real
   behavioural data from players and analyse it. Every task exports per-trial rows; the hub
   exports the whole battery as one tidy long-format CSV (task,trial,condition,stimulus,response,
   correct,rt_ms,note) — the actual research artifact behind the pilot.

   Honest ownership: pure HTML/CSS/JS, no libraries. Truthful claim: "I built a bilingual
   cognitive-testing lab from scratch (Stroop, Go/No-Go, reaction-time and working-memory tasks),
   collected real behavioural data from players and analysed it." Educational tool, not a
   clinical or diagnostic test. Reference ranges shown are approximate, from general literature,
   for orientation only. */

/* ============================ shared plumbing ============================ */
const $ = id => document.getElementById(id);
const avg = a => a.reduce((x,y)=>x+y,0)/a.length;
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rand = (lo,hi) => lo + Math.random()*(hi-lo);
let lang='kz';
const L = o => (o && (o[lang] ?? o.kz)) ;

let timers=[];
function later(fn,ms){ const id=setTimeout(fn,ms); timers.push(id); return id; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1500); }

/* localStorage: last summary + last per-trial log per task */
const PROF_KEY = id => 'ss_prof_'+id;
const LOG_KEY  = id => 'ss_log_'+id;
function saveResult(id, summary, log){
  try{
    localStorage.setItem(PROF_KEY(id), JSON.stringify(summary));
    localStorage.setItem(LOG_KEY(id),  JSON.stringify(log));
  }catch(e){}
}
function loadSummary(id){ try{ return JSON.parse(localStorage.getItem(PROF_KEY(id))||'null'); }catch(e){ return null; } }
function loadLog(id){ try{ return JSON.parse(localStorage.getItem(LOG_KEY(id))||'null'); }catch(e){ return null; } }

/* shared static UI copy */
const UI = {
  kz:{ tagline:'Танымыңды өлшейтін шағын зертхана: назар, тежелу, жылдамдық, есте сақтау.',
       hubTitle:'Таным зертханасы',
       hubLead:'Төрт қысқа тапсырма, әрқайсысы мидың бөлек қабілетін өлшейді. Бір немесе бәрін орындаңыз, содан кейін өз таным бейнеңізді көріңіз. Барлық деректерді бір CSV файлға жүктеп алуға болады.',
       openProfile:'Менің таным бейнем →', download:'Барлық деректер (CSV)',
       start:'Бастау →', introBack:'← Артқа', back:'← Зертханаға',
       again:'Қайта', share:'Нәтижені бөлісу', toHub:'Зертханаға', quit:'Тоқтату',
       getReady:'Дайын болыңыз…', practiceBadge:'жаттығу',
       progress:(a,b)=>`${a} / ${b}`,
       measures:'Өлшейді:', doneTag:'орындалды',
       profTitle:'Сіздің таным бейнеңіз',

const U = () => UI[lang];

/* ============================ TASK 1 — STROOP ============================ */
const STROOP = (()=>{
  const COLORS = [
    {key:'red',    hex:'#e5484d', kz:'ҚЫЗЫЛ',  ru:'КРАСНЫЙ'},
    {key:'blue',   hex:'#3aa0ff', kz:'КӨК',    ru:'СИНИЙ'},
    {key:'green',  hex:'#30a46c', kz:'ЖАСЫЛ',  ru:'ЗЕЛЁНЫЙ'},
    {key:'yellow', hex:'#f5d90a', kz:'САРЫ',   ru:'ЖЁЛТЫЙ'},
  ];
  const FIXATION=500, FEEDBACK=250, ITI=300, TIMEOUT=3000, PRACTICE_N=4;
  let N=20, doPractice=true;
  let trials=[], idx=0, res=[], accepting=false, onset=0, mode='real', onFinish=null;

  const t = {
    kz:{ name:'Струп тесті', tag:'Түс пен сөз таласқанда', measure:'назар · қайшылықты жеңу',
         hook:'Сөздің мағынасы мен түсі сәйкес келмегенде миыңыз бөгеледі. Қаншалықты? Оны өлшейміз.',
         how:['Сөз түрлі түспен жазылады («ҚЫЗЫЛ» көк болуы мүмкін).',
              'Сөздің МАҒЫНАСЫН емес, ЖАЗЫЛҒАН ТҮСІН таңдаңыз.',
              'Жылдам, бірақ қатесіз. 1–4 пернелерін де қолдануға болады.'],
         sciSummary:'Бұл нені өлшейді? (ғылымы)',
         sciBody:'Бұл — <b>Струп тесті</b> (Дж. Ридли Струп, 1935). Мағына мен түс <b>сәйкес</b> келгенде тез жауап бересіз; <b>қайшы</b> келгенде екі сигнал таласады да, жауап баяулайды. Осы баяулау — <b>қайшылық құны</b> (қайшы уақыт − сәйкес уақыт), назар мен импульсті тежеудің өлшемі.',
         resTitle:'Струп нәтижесі', lStroop:'Қайшылық құны', lRT:'Орташа уақыт', lAcc:'Дәлдік',
         nCon:'Сәйкес сөздер', nInc:'Қайшы сөздер',
         interp:(s,rt,acc)=>`<b>Қайшылық құны ${s} мс</b> — түс пен мағына таласқанда миыңызға кеткен қосымша уақыт. Дәлдік <b>${acc}%</b>, орташа уақыт <b>${rt} мс</b>.`,
         rtdTitle:'Реакция уақытының таралуы (дұрыс жауаптар, мс)',
         profSub:'қайшылық құны', band:'шамамен 100–250 мс' },
    ru:{ name:'Тест Струпа', tag:'Когда цвет спорит со словом', measure:'внимание · подавление конфликта',
         hook:'Когда значение слова и его цвет не совпадают, мозг тормозит. Насколько? Это и измеряем.',
         how:['Слово написано цветом («КРАСНЫЙ» может быть синим).',
              'Выбирайте ЦВЕТ слова, а не его ЗНАЧЕНИЕ.',
              'Быстро, но без ошибок. Можно клавиши 1–4.'],
         sciSummary:'Что это измеряет? (наука)',
         sciBody:'Это <b>тест Струпа</b> (Дж. Ридли Струп, 1935). Когда значение и цвет <b>совпадают</b>, ответ быстрый; когда <b>конфликтуют</b>, два сигнала спорят и ответ замедляется. Это замедление — <b>цена конфликта</b> (конфликтное время − совпадающее), мера внимания и торможения импульса.',
         resTitle:'Результат Струпа', lStroop:'Цена конфликта', lRT:'Среднее время', lAcc:'Точность',
         nCon:'Совпадающие', nInc:'Конфликтные',
         interp:(s,rt,acc)=>`<b>Цена конфликта ${s} мс</b> — лишнее время, когда цвет спорит со значением. Точность <b>${acc}%</b>, среднее время <b>${rt} мс</b>.`,
         rtdTitle:'Распределение времени реакции (верные, мс)',
         profSub:'цена конфликта', band:'примерно 100–250 мс' },
  };
  const TT = () => t[lang];

  function buildTrials(n){
    const list=[];
    for(let i=0;i<n;i++){
      const word=COLORS[i%COLORS.length];
      let ink;
      if(i<n/2) ink=word;
      else { const o=COLORS.filter(c=>c.key!==word.key); ink=o[Math.floor(Math.random()*o.length)]; }
      list.push({word, ink, congruent:word.key===ink.key});
    }
    return shuffle(list);
  }
  function renderSetup(mount){
    mount.innerHTML =
      `<div class="row"><span class="label">${U().lenLabel}</span>
        <div class="seg" id="sLen">
          <button data-n="10">10</button><button data-n="20" class="active">20</button><button data-n="30">30</button>
        </div></div>
       <div class="row"><label class="check"><input type="checkbox" id="sPr" checked><span>${U().practiceLabel}</span></label></div>`;
    mount.querySelectorAll('#sLen button').forEach(b=>b.onclick=()=>{
      N=parseInt(b.dataset.n,10);
      mount.querySelectorAll('#sLen button').forEach(x=>x.classList.toggle('active',x===b));
    });
    $('sPr').onchange=e=>doPractice=e.target.checked;
  }
  function renderControls(){
    const box=$('controls'); box.className='controls answers'; box.innerHTML='';
    COLORS.forEach((c,i)=>{
      const b=document.createElement('button');
      b.style.background=c.hex; b.innerHTML=`<span class="k">${i+1}</span>`;
      b.setAttribute('aria-label', L(c));
      b.onclick=()=>respond(c.key);
      box.appendChild(b);
    });
  }
  function start(onDone){
    onFinish=onDone;
    $('stage').className='stage'; renderControls();
    if(doPractice) runBlock('practice', PRACTICE_N, ()=>countdown(()=>runBlock('real', N, finish)));
    else countdown(()=>runBlock('real', N, finish));
  }
  let blockDone=null;
  function runBlock(m,n,done){ mode=m; trials=buildTrials(n); idx=0; res=[]; blockDone=done; nextTrial(); }
  function countdown(done){
    const stage=$('stage'); $('progress').textContent=U().getReady; $('pfill').style.width='0%'; accepting=false;
    let n=3;
    const tick=()=>{ if(n===0){ stage.className='stage'; stage.innerHTML='<span class="fix">+</span>'; return done(); }
      stage.className='stage'; stage.innerHTML=`<span class="count">${n}</span>`; n--; later(tick,620); };
    tick();
  }
  function prog(){
    const badge = mode==='practice' ? ` <span class="badge">${U().practiceBadge}</span>` : '';
    $('progress').innerHTML=U().progress(idx+1,trials.length)+badge;
    $('pfill').style.width=(100*idx/trials.length)+'%';
  }
  function nextTrial(){
    if(idx>=trials.length){ $('pfill').style.width='100%'; return blockDone(); }
    prog();
    const stage=$('stage'); stage.className='stage'; stage.innerHTML='<span class="fix">+</span>'; accepting=false;
    later(()=>{ const tr=trials[idx];
      stage.innerHTML=`<span class="word" style="color:${tr.ink.hex}">${L(tr.word)}</span>`;
      accepting=true; onset=performance.now();
      later(()=>respond(null), TIMEOUT);
    }, FIXATION);
  }
  function respond(colorKey){
    if(!accepting) return;
    accepting=false; clearTimers();
    const tr=trials[idx]; const rt=Math.round(performance.now()-onset); const correct=colorKey===tr.ink.key;
    res.push({rt,correct,congruent:tr.congruent,timeout:colorKey===null,word:tr.word.key,ink:tr.ink.key,chose:colorKey});
    const stage=$('stage'); stage.classList.add(correct?'flash-ok':'flash-bad'); idx++;
    later(()=>{ stage.className='stage'; later(nextTrial, ITI); }, FEEDBACK);
  }
  function stats(r){
    const cor=r.filter(x=>x.correct);
    const acc=Math.round(100*cor.length/r.length);
    const meanRT=cor.length?Math.round(avg(cor.map(x=>x.rt))):0;
    const con=cor.filter(x=>x.congruent).map(x=>x.rt), inc=cor.filter(x=>!x.congruent).map(x=>x.rt);
    const conRT=con.length?Math.round(avg(con)):null, incRT=inc.length?Math.round(avg(inc)):null;
    const stroop=(con.length&&inc.length)?Math.round(avg(inc)-avg(con)):null;
    return {stroop,meanRT,acc,conRT,incRT,errors:r.length-cor.length,n:r.length};
  }
  function finish(){ const s=stats(res); saveResult('stroop', s, res.slice()); onFinish(s, res.slice()); }

  function renderResults(s, log, mount){
    const tt=TT();
    mount.innerHTML =
      `<div class="metrics">
        <div class="metric head"><div class="v">${s.stroop==null?'—':s.stroop+' ms'}</div><div class="l">${tt.lStroop}</div></div>
        <div class="metric"><div class="v">${s.meanRT} ms</div><div class="l">${tt.lRT}</div></div>
        <div class="metric"><div class="v">${s.acc}%</div><div class="l">${tt.lAcc}</div></div>
      </div>
      <div class="bars">
        <div class="row"><span class="name">${tt.nCon}</span><span class="track"><span class="fill con" id="bc"></span></span><span class="val">${s.conRT?s.conRT+' ms':'—'}</span></div>
        <div class="row"><span class="name">${tt.nInc}</span><span class="track"><span class="fill inc" id="bi"></span></span><span class="val">${s.incRT?s.incRT+' ms':'—'}</span></div>
      </div>
      <div class="rtd" id="rtd" style="display:none"><div class="rtd-title">${tt.rtdTitle}</div>
        <div class="rtd-chart" id="rtdChart"></div>
        <div class="rtd-axis"><span id="rtdMin"></span><span id="rtdMax"></span></div></div>
      <div class="interp">${tt.interp(s.stroop==null?'—':s.stroop, s.meanRT, s.acc)}</div>`;
    const maxRT=Math.max(s.conRT||0,s.incRT||0)||1;
    $('bc').style.width=s.conRT?(100*s.conRT/maxRT)+'%':'0';
    $('bi').style.width=s.incRT?(100*s.incRT/maxRT)+'%':'0';
    const rts=log.filter(r=>r.correct&&!r.timeout).map(r=>r.rt);
    if(rts.length>=4){
      $('rtd').style.display='block';
      const mn=Math.min(...rts), mx=Math.max(...rts), sp=(mx-mn)||1, B=8, c=new Array(B).fill(0);
      rts.forEach(v=>{ let b=Math.floor((v-mn)/sp*B); if(b>=B)b=B-1; if(b<0)b=0; c[b]++; });
      const pk=Math.max(...c)||1;
      $('rtdChart').innerHTML=c.map(x=>`<span class="bin" style="height:${Math.max(4,Math.round(100*x/pk))}%"></span>`).join('');
      $('rtdMin').textContent=mn+' '+U().ms; $('rtdMax').textContent=mx+' '+U().ms;
    }
  }
  const csv = log => ({
    header:['trial','condition','word','ink','chosen','correct','rt_ms','timed_out'],
    rows: log.map((r,i)=>[i+1, r.congruent?'congruent':'incongruent', r.word||'', r.ink||'', r.chose||'', r.correct?1:0, r.rt, r.timeout?1:0])
  });
  const toLong = log => log.map((r,i)=>['stroop', i+1, r.congruent?'congruent':'incongruent',
      (r.word||'')+'/'+(r.ink||''), r.chose||'', r.correct?1:0, r.rt, r.timeout?'timeout':'']);
  const profile = s => ({ value: s.stroop==null?'—':s.stroop+' '+U().ms, sub:TT().profSub, band:TT().band });
  const card = s => ({ big: s.stroop==null?'—':s.stroop+' ms', bigLabel:TT().lStroop,
      a:[s.meanRT+' ms', TT().lRT], b:[s.acc+'%', TT().lAcc] });

  return { id:'stroop', icon:'🎯', accent:'var(--red)',
    meta:()=>({name:TT().name, tag:TT().tag, measure:TT().measure, hook:TT().hook, how:TT().how,
              sciSummary:TT().sciSummary, sciBody:TT().sciBody, resTitle:TT().resTitle}),
    renderSetup, start, renderResults, csv, toLong, profile, card };
})();

/* ============================ TASK 2 — GO / NO-GO ============================ */
const GONOGO = (()=>{
  const N=30, GO_RATIO=0.7, FIXATION=400, WINDOW=1000, FEEDBACK=250, ITI=350;
  let trials=[], idx=0, res=[], accepting=false, onset=0, responded=false, onFinish=null;

  const t={
    kz:{ name:'Импульс тесті', tag:'Бас, бірақ ұстан', measure:'импульсті тежеу',
         hook:'Оңай — басу. Қиын — керек кезде БАСПАУ. Осы тежелуді өлшейміз.',
         how:['🟢 Жасыл дөңгелек шықса — тез БАСЫҢЫЗ (бос орын пернесі немесе батырма).',
              '🟥 Қызыл шаршы шықса — ЕШТЕҢЕ ІСТЕМЕҢІЗ, ұстаныңыз.',
              'Көбі жасыл, сондықтан қол автоматты түрде басуға тырысады — міне, қиындығы сонда.'],
         sciSummary:'Бұл нені өлшейді? (ғылымы)',
         sciBody:'Бұл — <b>Go/No-Go тапсырмасы</b>, реакцияны тежеудің классикалық сынағы. Сигналдардың көбі «бас» болғандықтан, ми басуға бейімделеді; сирек «баспа» сигналында осы дайын қимылды <b>тежеу</b> керек. Қате басу (No-Go-да басу) — <b>импульсивтіліктің</b> өлшемі; жіберіп алу (Go-да баспау) — назардың өлшемі.',
         resTitle:'Импульс тесті нәтижесі',
         lComm:'Қате басу', lHit:'Дұрыс басу', lRT:'Орташа уақыт',
         nHit:'Дұрыс басу (Go)', nComm:'Қате басу (No-Go)', nOmit:'Жіберіп алу',
         interp:(comm,rt,hit)=>`Сіз тежеу керек кезде <b>${comm}</b> рет қате бастыңыз (импульсивтілік). Керек кезде <b>${hit}%</b> дұрыс бастыңыз, орташа уақыт <b>${rt} мс</b>. Аз қате басу = жақсы өзін-өзі бақылау.`,
         press:'БАСУ', profSub:'қате басу (импульс)', band:'аз болған сайын жақсы' },
    ru:{ name:'Тест импульса', tag:'Жми, но сдержись', measure:'торможение импульса',
         hook:'Легко — нажать. Трудно — НЕ нажать, когда нельзя. Это торможение и измеряем.',
         how:['🟢 Зелёный круг — быстро НАЖМИТЕ (пробел или кнопка).',
              '🟥 Красный квадрат — НЕ делайте ничего, сдержитесь.',
              'Зелёного больше, рука привыкает жать — в этом и сложность.'],
         sciSummary:'Что это измеряет? (наука)',
         sciBody:'Это <b>задача Go/No-Go</b>, классический тест торможения реакции. Большинство сигналов — «жми», мозг настраивается на нажатие; на редком «не жми» нужно <b>затормозить</b> уже готовое движение. Ошибочное нажатие (на No-Go) — мера <b>импульсивности</b>; пропуск (не нажал на Go) — мера внимания.',
         resTitle:'Результат теста импульса',
         lComm:'Ошибок торможения', lHit:'Верных нажатий', lRT:'Среднее время',
         nHit:'Верных нажатий (Go)', nComm:'Ошибочных (No-Go)', nOmit:'Пропусков',
         interp:(comm,rt,hit)=>`Вы нажали, когда нельзя, <b>${comm}</b> раз (импульсивность). Верно нажали в <b>${hit}%</b> нужных случаев, среднее время <b>${rt} мс</b>. Меньше ошибок = лучше самоконтроль.`,
         press:'НАЖАТЬ', profSub:'ошибки торможения', band:'чем меньше, тем лучше' },
  };
  const TT=()=>t[lang];

  function build(){
    const list=[]; const goN=Math.round(N*GO_RATIO);
    for(let i=0;i<N;i++) list.push({go: i<goN});
    return shuffle(list);
  }
  function renderControls(){
    const box=$('controls'); box.className='controls';
    box.innerHTML=`<button class="bigbtn" id="gngBtn">${TT().press}</button>`;
    $('gngBtn').onclick=press;
  }
  function start(onDone){ onFinish=onDone; renderControls(); trials=build(); idx=0; res=[]; nextTrial(); }
  function prog(){ $('progress').innerHTML=U().progress(idx+1,trials.length); $('pfill').style.width=(100*idx/trials.length)+'%'; }
  function nextTrial(){
    if(idx>=trials.length){ $('pfill').style.width='100%'; return finish(); }
    prog();
    const stage=$('stage'); stage.className='stage dark'; stage.innerHTML='<span class="fix">+</span>'; accepting=false;
    later(()=>{
      const tr=trials[idx];
      const color = tr.go ? 'var(--green)' : 'var(--red)';
      const shapeCls = tr.go ? 'shape circle' : 'shape';
      stage.innerHTML=`<div class="${shapeCls}" style="background:${color}"></div>`;
      accepting=true; responded=false; onset=performance.now();
      later(()=>resolveTrial(), WINDOW);
    }, FIXATION);
  }
  function press(){
    if(!accepting || responded) return;
    responded=true;
    const tr=trials[idx]; const rt=Math.round(performance.now()-onset);
    // record now; resolveTrial will finalize display + advance at window end handled here
    accepting=false; clearTimers();
    const correct = tr.go;                       // pressing is correct only on Go
    res.push({go:tr.go, pressed:true, correct, rt});
    flashAndNext(correct);
  }
  function resolveTrial(){
    if(responded) return;                        // already handled by press()
    accepting=false;
    const tr=trials[idx];
    const correct = !tr.go;                      // withholding is correct only on No-Go
    res.push({go:tr.go, pressed:false, correct, rt:null});
    flashAndNext(correct);
  }
  function flashAndNext(correct){
    const stage=$('stage'); stage.classList.remove('dark'); stage.classList.add(correct?'flash-ok':'flash-bad'); idx++;
    later(()=>{ stage.className='stage dark'; stage.innerHTML=''; later(nextTrial, ITI); }, FEEDBACK);
  }
  function stats(r){
    const go=r.filter(x=>x.go), nogo=r.filter(x=>!x.go);
    const hits=go.filter(x=>x.pressed), omit=go.filter(x=>!x.pressed);
    const comm=nogo.filter(x=>x.pressed);
    const hitPct=go.length?Math.round(100*hits.length/go.length):0;
    const meanRT=hits.length?Math.round(avg(hits.map(x=>x.rt))):0;
    return {commission:comm.length, omission:omit.length, hitPct, meanRT,
            goN:go.length, nogoN:nogo.length, hits:hits.length, n:r.length};
  }
  function finish(){ const s=stats(res); saveResult('gng', s, res.slice()); onFinish(s, res.slice()); }

  function renderResults(s, log, mount){
    const tt=TT();
    mount.innerHTML=
      `<div class="metrics">
        <div class="metric head"><div class="v">${s.commission}</div><div class="l">${tt.lComm}</div></div>
        <div class="metric"><div class="v">${s.hitPct}%</div><div class="l">${tt.lHit}</div></div>
        <div class="metric"><div class="v">${s.meanRT} ms</div><div class="l">${tt.lRT}</div></div>
      </div>
      <div class="interp">${tt.interp(s.commission, s.meanRT, s.hitPct)}</div>
      <div class="note">${tt.nHit}: ${s.hits}/${s.goN} · ${tt.nComm}: ${s.commission}/${s.nogoN} · ${tt.nOmit}: ${s.omission}</div>`;
  }
  const csv = log => ({
    header:['trial','type','pressed','correct','rt_ms'],
    rows: log.map((r,i)=>[i+1, r.go?'go':'nogo', r.pressed?1:0, r.correct?1:0, r.rt==null?'':r.rt])
  });
  const toLong = log => log.map((r,i)=>['gng', i+1, r.go?'go':'nogo', r.go?'green_circle':'red_square',
      r.pressed?'press':'withhold', r.correct?1:0, r.rt==null?'':r.rt, r.correct?'':(r.go?'omission':'commission')]);
  const profile = s => ({ value:String(s.commission), sub:TT().profSub, band:TT().band });
  const card = s => ({ big:String(s.commission), bigLabel:TT().lComm,
      a:[s.hitPct+'%', TT().lHit], b:[s.meanRT+' ms', TT().lRT] });

  return { id:'gng', icon:'🚦', accent:'var(--green)',
    meta:()=>({name:TT().name, tag:TT().tag, measure:TT().measure, hook:TT().hook, how:TT().how,
              sciSummary:TT().sciSummary, sciBody:TT().sciBody, resTitle:TT().resTitle}),
    renderSetup:null, start, renderResults, csv, toLong, profile, card };
})();

/* ============================ TASK 3 — REACTION TIME ============================ */
const REACTION = (()=>{
  const N=5;
  let idx=0, res=[], state='idle', onset=0, onFinish=null;   // state: wait | ready | idle

  const t={
    kz:{ name:'Реакция уақыты', tag:'Жасыл болғанда бас', measure:'таза жылдамдық',
         hook:'Ешқандай ойлау жоқ — тек жылдамдық. Экран жасыл болған сәтте басыңыз.',
         how:['Экран қызыл — КҮТІҢІЗ.',
              'Жасыл болған сәтте — бірден БАСЫҢЫЗ (батырма, экран немесе бос орын).',
              'Ерте бассаңыз — жалған бастау, сынақ қайталанады.'],
         sciSummary:'Бұл нені өлшейді? (ғылымы)',
         sciBody:'Бұл — <b>қарапайым реакция уақыты</b>: бір сигнал, бір жауап. Ол ойлау немесе таңдау емес, тек көру-қимыл тізбегінің таза <b>жылдамдығын</b> өлшейді. Ересектерде әдетте 200–300 мс шамасында. Басқа тапсырмалармен салыстырғанда, бұл сіздің «негізгі жылдамдығыңыз».',
         resTitle:'Реакция уақыты нәтижесі',
         lMean:'Орташа', lBest:'Ең жылдам', lFalse:'Жалған бастау',
         waitMsg:'Күтіңіз…', goMsg:'БАСЫҢЫЗ!', early:'Тым ерте! Күтіңіз.',
         interp:(mean,best)=>`Орташа реакцияңыз <b>${mean} мс</b>, ең жылдамы <b>${best} мс</b>. Бұл — ешқандай шешімсіз, таза жылдамдығыңыз.`,
         tap:'БАСУ', profSub:'орташа реакция', band:'шамамен 200–300 мс' },
    ru:{ name:'Время реакции', tag:'Жми, когда зелёный', measure:'чистая скорость',
         hook:'Никаких раздумий — только скорость. Жмите в момент, когда экран станет зелёным.',
         how:['Экран красный — ЖДИТЕ.',
              'Стал зелёным — сразу ЖМИТЕ (кнопка, экран или пробел).',
              'Нажали раньше — фальстарт, проба повторится.'],
         sciSummary:'Что это измеряет? (наука)',
         sciBody:'Это <b>простое время реакции</b>: один сигнал, один ответ. Оно измеряет не раздумье и не выбор, а чистую <b>скорость</b> сенсомоторной цепи. У взрослых обычно 200–300 мс. По сравнению с другими заданиями это ваша «базовая скорость».',
         resTitle:'Результат времени реакции',
         lMean:'Среднее', lBest:'Лучшее', lFalse:'Фальстарты',
         waitMsg:'Ждите…', goMsg:'ЖМИ!', early:'Слишком рано! Ждите.',
         interp:(mean,best)=>`Среднее время реакции <b>${mean} мс</b>, лучшее <b>${best} мс</b>. Это ваша чистая скорость без всякого решения.`,
         tap:'НАЖАТЬ', profSub:'среднее время', band:'примерно 200–300 мс' },
  };
  const TT=()=>t[lang];

  function start(onDone){ onFinish=onDone; idx=0; res=[]; runTrial(); }
  function prog(){ $('progress').textContent=U().progress(Math.min(idx+1,N),N); $('pfill').style.width=(100*idx/N)+'%'; }
  function renderControls(){
    const box=$('controls'); box.className='controls';
    box.innerHTML=`<button class="bigbtn" id="rtBtn">${TT().tap}</button>`;
    $('rtBtn').onclick=hit;
  }
  function runTrial(){
    if(idx>=N){ $('pfill').style.width='100%'; return finish(); }
    prog(); renderControls();
    const stage=$('stage'); stage.className='stage wait';
    stage.innerHTML=`<span class="bigmsg w">${TT().waitMsg}</span>`;
    state='wait';
    later(()=>{
      if(state!=='wait') return;                 // a false start reset it
      const stg=$('stage'); stg.className='stage go';
      stg.innerHTML=`<span class="bigmsg g">${TT().goMsg}</span>`;
      state='ready'; onset=performance.now();
    }, rand(1200,3200));
  }
  function hit(){
    if(state==='wait'){                          // false start
      state='idle';
      const stage=$('stage'); stage.className='stage'; stage.innerHTML=`<span class="bigmsg w">${TT().early}</span>`;
      res.push({rt:null, falseStart:true});
      later(()=>runTrial(), 1100);               // repeat this trial slot (idx not advanced counts as a logged false start)
      return;
    }
    if(state==='ready'){
      const rt=Math.round(performance.now()-onset);
      res.push({rt, falseStart:false});
      state='idle'; idx++;
      const stage=$('stage'); stage.className='stage'; stage.innerHTML=`<span class="count">${rt}</span>`;
      later(()=>runTrial(), 850);
    }
  }
  function stats(r){
    const valid=r.filter(x=>!x.falseStart && x.rt!=null).map(x=>x.rt);
    const mean=valid.length?Math.round(avg(valid)):0;
    const best=valid.length?Math.min(...valid):0;
    const fs=r.filter(x=>x.falseStart).length;
    return {mean, best, falseStarts:fs, n:valid.length};
  }
  function finish(){ const s=stats(res); saveResult('rt', s, res.slice()); onFinish(s, res.slice()); }

  function renderResults(s, log, mount){
    const tt=TT();
    mount.innerHTML=
      `<div class="metrics">
        <div class="metric head"><div class="v">${s.mean} ms</div><div class="l">${tt.lMean}</div></div>
        <div class="metric"><div class="v">${s.best} ms</div><div class="l">${tt.lBest}</div></div>
        <div class="metric"><div class="v">${s.falseStarts}</div><div class="l">${tt.lFalse}</div></div>
      </div>
      <div class="interp">${tt.interp(s.mean, s.best)}</div>`;
  }
  const csv = log => ({
    header:['attempt','rt_ms','false_start'],
    rows: log.map((r,i)=>[i+1, r.rt==null?'':r.rt, r.falseStart?1:0])
  });
  const toLong = log => log.map((r,i)=>['reaction', i+1, 'simple', 'green_screen',
      r.falseStart?'early':'press', r.falseStart?0:1, r.rt==null?'':r.rt, r.falseStart?'false_start':'']);
  const profile = s => ({ value:s.mean+' '+U().ms, sub:TT().profSub, band:TT().band });
  const card = s => ({ big:s.mean+' ms', bigLabel:TT().lMean,
      a:[s.best+' ms', TT().lBest], b:[String(s.falseStarts), TT().lFalse] });

  return { id:'rt', icon:'⚡', accent:'var(--yellow)',
    meta:()=>({name:TT().name, tag:TT().tag, measure:TT().measure, hook:TT().hook, how:TT().how,
              sciSummary:TT().sciSummary, sciBody:TT().sciBody, resTitle:TT().resTitle}),
    renderSetup:null, start, renderResults, csv, toLong, profile, card };
})();

/* ============================ TASK 4 — DIGIT SPAN ============================ */
const SPAN = (()=>{
  const START=3, MAX=9, SHOW=750, GAP=250;
  let length=START, fails=0, rounds=[], seq=[], entry=[], phase='show', onFinish=null, bestLen=0;

  const t={
    kz:{ name:'Сандар аралығы', tag:'Қанша санды ұстай аласың?', measure:'жедел (жұмыс) есте сақтау',
         hook:'Сандар бірінен соң бірі жанады. Бәрін ретімен есте сақтап, қайталаңыз. Тізбек ұзарып отырады.',
         how:['Сандар жеке-жеке көрсетіледі — оларды ретімен есте сақтаңыз.',
              'Содан кейін дәл сол ретпен теріңіз.',
              'Дұрыс болса — тізбек 1 санға ұзарады. Екі рет қателессеңіз — аяқталады.'],
         sciSummary:'Бұл нені өлшейді? (ғылымы)',
         sciBody:'Бұл — <b>сандар аралығы</b> тесті, жедел (жұмыс) есте сақтаудың классикалық өлшемі: ақпаратты санаңызда қысқа уақыт ұстап тұру сыйымдылығы. Ересектерде әдетте <b>7 ± 2</b> сан (Миллер, 1956). Бұл — назар мен ойлаудың негізі болатын «ой блокноты».',
         resTitle:'Сандар аралығы нәтижесі',
         lSpan:'Сіздің аралығыңыз', lRounds:'Дұрыс раунд',
         show:'Есте сақтаңыз…', recall:'Ретімен теріңіз:',
         interp:(span)=>`Сіз ретімен <b>${span} санды</b> дұрыс қайталадыңыз. Бұл — жедел есте сақтау сыйымдылығыңыз (әдетте 7 ± 2).`,
         del:'⌫', ok:'Дайын', digits:'сан',
         profSub:'сандар аралығы', band:'әдетте 7 ± 2' },
    ru:{ name:'Объём цифр', tag:'Сколько цифр удержишь?', measure:'рабочая память',
         hook:'Цифры загораются одна за другой. Запомните все по порядку и повторите. Цепочка растёт.',
         how:['Цифры показываются по одной — запомните их по порядку.',
              'Затем введите в том же порядке.',
              'Верно — цепочка растёт на 1. Две ошибки подряд — конец.'],
         sciSummary:'Что это измеряет? (наука)',
         sciBody:'Это тест <b>объёма цифр</b>, классическая мера рабочей памяти: сколько единиц информации вы удерживаете «в уме» короткое время. У взрослых обычно <b>7 ± 2</b> (Миллер, 1956). Это «блокнот ума», основа внимания и мышления.',
         resTitle:'Результат объёма цифр',
         lSpan:'Ваш объём', lRounds:'Верных раундов',
         show:'Запоминайте…', recall:'Введите по порядку:',
         interp:(span)=>`Вы верно повторили <b>${span} цифр</b> по порядку. Это объём вашей рабочей памяти (обычно 7 ± 2).`,
         del:'⌫', ok:'Готово', digits:'цифр',
         profSub:'объём цифр', band:'обычно 7 ± 2' },
  };
  const TT=()=>t[lang];

  function start(onDone){ onFinish=onDone; length=START; fails=0; rounds=[]; bestLen=0; showRound(); }
  function prog(){ $('progress').textContent=`${TT().digits}: ${length}`; $('pfill').style.width=(100*(length-START)/(MAX-START))+'%'; }
  function showRound(){
    prog();
    seq=[]; for(let i=0;i<length;i++) seq.push(Math.floor(Math.random()*10));
    entry=[]; phase='show';
    const stage=$('stage'); stage.className='stage'; stage.innerHTML=`<span class="fix">${TT().show}</span>`;
    $('controls').innerHTML='';
    let i=0;
    const showNext=()=>{
      if(i>=seq.length){ later(()=>recall(), 350); return; }
      stage.innerHTML=`<span class="digits">${seq[i]}</span>`;
      later(()=>{ stage.innerHTML='<span class="fix">+</span>'; i++; later(showNext, GAP); }, SHOW);
    };
    later(showNext, 700);
  }
  function recall(){
    phase='recall';
    const stage=$('stage'); stage.className='stage';
    stage.innerHTML=`<div class="seqentry" id="seqEntry"></div>`;
    $('progress').textContent=TT().recall;
    renderKeypad();
    updateEntry();
  }
  function renderKeypad(){
    const box=$('controls'); box.className='controls';
    const keys=['1','2','3','4','5','6','7','8','9','del','0','ok'];
    box.innerHTML=`<div class="keypad">${keys.map(k=>{
      if(k==='del') return `<button class="act" data-k="del">${TT().del}</button>`;
      if(k==='ok')  return `<button class="act" data-k="ok">${TT().ok}</button>`;
      return `<button data-k="${k}">${k}</button>`;
    }).join('')}</div>`;
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>keypad(b.dataset.k));
  }
  function keypad(k){
    if(phase!=='recall') return;
    if(k==='del'){ entry.pop(); updateEntry(); return; }
    if(k==='ok'){ if(entry.length===seq.length) submit(); return; }
    if(entry.length<seq.length){ entry.push(parseInt(k,10)); updateEntry(); if(entry.length===seq.length){ later(submit,250); } }
  }
  function updateEntry(){ const el=$('seqEntry'); if(el) el.textContent=entry.join(' ')||'·'; }
  function submit(){
    if(phase!=='recall') return;
    phase='done';
    const correct = entry.length===seq.length && entry.every((d,i)=>d===seq[i]);
    rounds.push({length, sequence:seq.join(''), entered:entry.join(''), correct});
    const stage=$('stage'); stage.classList.add(correct?'flash-ok':'flash-bad');
    if(correct) bestLen=Math.max(bestLen, length);
    later(()=>{
      stage.className='stage';
      if(correct){ fails=0; if(length>=MAX) return finish(); length++; showRound(); }
      else { fails++; if(fails>=2) return finish(); showRound(); }   // one retry at the same length
    }, 700);
  }
  function stats(r){
    const correct=r.filter(x=>x.correct);
    const span=correct.length?Math.max(...correct.map(x=>x.length)):0;
    return {span, rounds:r.length, correct:correct.length};
  }
  function finish(){ const s=stats(rounds); saveResult('span', s, rounds.slice()); onFinish(s, rounds.slice()); }

  function renderResults(s, log, mount){
    const tt=TT();
    mount.innerHTML=
      `<div class="metrics">
        <div class="metric head"><div class="v">${s.span}</div><div class="l">${tt.lSpan}</div></div>
        <div class="metric"><div class="v">${s.correct}</div><div class="l">${tt.lRounds}</div></div>
      </div>
      <div class="interp">${tt.interp(s.span)}</div>`;
  }
  const csv = log => ({
    header:['round','length','sequence','entered','correct'],
    rows: log.map((r,i)=>[i+1, r.length, "'"+r.sequence, "'"+r.entered, r.correct?1:0])
  });
  const toLong = log => log.map((r,i)=>['span', i+1, 'len'+r.length, r.sequence, r.entered, r.correct?1:0, '', '']);
  const profile = s => ({ value:String(s.span), sub:TT().profSub, band:TT().band });
  const card = s => ({ big:String(s.span), bigLabel:TT().lSpan,
      a:[String(s.correct), TT().lRounds], b:['7±2', TT().band] });

  return { id:'span', icon:'🧠', accent:'var(--purple)',
    meta:()=>({name:TT().name, tag:TT().tag, measure:TT().measure, hook:TT().hook, how:TT().how,
              sciSummary:TT().sciSummary, sciBody:TT().sciBody, resTitle:TT().resTitle}),
    renderSetup:null, start, renderResults, csv, toLong, profile, card };
})();

/* ============================ registry + navigation ============================ */
const TASKS = [STROOP, GONOGO, REACTION, SPAN];
const byId = id => TASKS.find(t=>t.id===id);
let current=null, lastSummary=null, lastLog=null;

/* ---- HUB ---- */
function renderHub(){
  $('hubTitle').textContent=U().hubTitle;
  $('hubLead').textContent=U().hubLead;
  $('openProfile').textContent=U().openProfile;
  $('hubDownload').textContent=U().download;
  const box=$('tiles'); box.innerHTML='';
  TASKS.forEach(task=>{
    const m=task.meta(); const done=loadSummary(task.id);
    const el=document.createElement('div'); el.className='tile';
    el.innerHTML=
      `<div class="top">
        <div class="ico" style="background:${task.accent}1f;color:${task.accent}">${task.icon}</div>
        <div><h3>${m.name}</h3><div class="measures">${U().measures} ${m.measure}</div></div>
      </div>
      <p>${m.tag}</p>
      ${done?`<div class="done">✓ ${U().doneTag}</div>`:''}`;
    el.onclick=()=>openIntro(task.id);
    box.appendChild(el);
  });
}
function goHub(){ clearTimers(); current=null; document.body.dataset.screen='hub'; renderHub(); }

/* ---- INTRO ---- */
function openIntro(id){
  current=byId(id);
  const m=current.meta();
  $('introTitle').textContent=m.name;
  $('hook').textContent=m.hook;
  $('how').innerHTML=m.how.map(li=>`<li>${li}</li>`).join('');
  $('sciSummary').textContent=m.sciSummary;
  $('sciBody').innerHTML=m.sciBody;
  $('start').textContent=U().start;
  $('introBack').textContent=U().introBack;
  const setup=$('setup');
  if(current.renderSetup){ setup.style.display='block'; current.renderSetup(setup); }
  else { setup.style.display='none'; setup.innerHTML=''; }
  document.body.dataset.screen='intro';
}

/* ---- TASK → RESULTS ---- */
function beginTask(){
  document.body.dataset.screen='task';
  $('quit').textContent=U().quit;
  $('stage').className='stage'; $('stage').innerHTML='<span class="fix">+</span>';
  $('controls').innerHTML=''; $('progress').textContent=''; $('pfill').style.width='0%';
  current.start((summary, log)=>{ lastSummary=summary; lastLog=log; showResults(); });
}
function showResults(){
  clearTimers();
  const m=current.meta();
  $('resTitle').textContent=m.resTitle;
  $('again').textContent=U().again; $('share').textContent=U().share;
  $('download').textContent=U().download; $('toHub').textContent=U().toHub;
  current.renderResults(lastSummary, lastLog, $('resBody'));
  document.body.dataset.screen='results';
}

/* ---- PROFILE ---- */
function openProfile(){
  $('profTitle').textContent=U().profTitle;
  $('profLead').textContent=U().profLead;
  $('profNote').textContent=U().profNote;
  $('profDownload').textContent=U().download;
  $('profBack').textContent=U().back;
  const box=$('profRows'); box.innerHTML='';
  TASKS.forEach(task=>{
    const m=task.meta(); const s=loadSummary(task.id);
    const el=document.createElement('div');
    if(s){
      const p=task.profile(s);
      el.className='prow';
      el.innerHTML=
        `<div class="ico" style="background:${task.accent}1f;color:${task.accent}">${task.icon}</div>
         <div><div class="name">${m.name}</div><div class="sub">${p.sub}</div></div>
         <div class="val"><div class="n">${p.value}</div><div class="band">${p.band}</div></div>`;
      el.style.cursor='pointer'; el.onclick=()=>openIntro(task.id);
    } else {
      el.className='prow empty';
      el.innerHTML=
        `<div class="ico" style="background:${task.accent}1f;color:${task.accent}">${task.icon}</div>
         <div><div class="name">${m.name}</div><div class="sub">${m.measure}</div></div>
         <div class="val"><div class="n">${U().profEmpty}</div></div>`;
      el.style.cursor='pointer'; el.onclick=()=>openIntro(task.id);
    }
    box.appendChild(el);
  });
  document.body.dataset.screen='profile';
}

/* ---- CSV export ---- */
function downloadFile(name, text){
  const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function stamp(){ const d=new Date();
  return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function downloadCurrentCSV(){
  if(!current || !lastLog){ return; }
  const {header, rows}=current.csv(lastLog);
  const csv=[header].concat(rows).map(r=>r.join(',')).join('\n');
  downloadFile(`splitsecond-${current.id}-${stamp()}.csv`, csv);
  toast(U().downloaded);
}
/* combined long-format dataset across every task the player has done on this device */
function downloadBatteryCSV(){
  const header=['task','trial','condition','stimulus','response','correct','rt_ms','note'];
  let rows=[];
  TASKS.forEach(task=>{ const log=loadLog(task.id); if(log && log.length) rows=rows.concat(task.toLong(log)); });
  if(!rows.length){ toast(U().noData); return; }
  const csv=[header].concat(rows).map(r=>r.join(',')).join('\n');
  downloadFile(`splitsecond-battery-${stamp()}.csv`, csv);
  toast(U().downloaded);
}

/* ---- share card (generic, per task) ---- */
const CARD_FONT='-apple-system,Segoe UI,Roboto,Arial,sans-serif';
function roundRect(x,rx,ry,w,h,r){ x.beginPath(); x.moveTo(rx+r,ry);
  x.arcTo(rx+w,ry,rx+w,ry+h,r); x.arcTo(rx+w,ry+h,rx,ry+h,r);
  x.arcTo(rx,ry+h,rx,ry,r); x.arcTo(rx,ry,rx+w,ry,r); x.closePath(); }
function makeCardBlob(){
  return new Promise(resolve=>{
    const m=current.meta(); const c=current.card(lastSummary);
    const cv=$('cardCanvas'), x=cv.getContext('2d'), W=1080, H=1080;
    x.fillStyle='#0f1720'; x.fillRect(0,0,W,H);
    x.fillStyle='#17222e'; x.strokeStyle='#243343'; x.lineWidth=3;
    roundRect(x,60,60,W-120,H-120,44); x.fill(); x.stroke();
    x.textAlign='center';
    x.fillStyle='#e8eef4'; x.font='700 62px '+CARD_FONT; x.fillText('SplitSecond', W/2, 195);
    x.fillStyle='#9fb2c4'; x.font='400 34px '+CARD_FONT; x.fillText(m.name, W/2, 250);
    x.fillStyle='#3aa0ff'; x.font='800 180px '+CARD_FONT; x.fillText(c.big, W/2, 545);
    x.fillStyle='#9fb2c4'; x.font='500 40px '+CARD_FONT; x.fillText(c.bigLabel, W/2, 615);
    x.fillStyle='#e8eef4'; x.font='800 84px '+CARD_FONT;
    x.fillText(c.a[0], W/2-232, 805); x.fillText(c.b[0], W/2+232, 805);
    x.fillStyle='#9fb2c4'; x.font='500 32px '+CARD_FONT;
    x.fillText(c.a[1], W/2-232, 856); x.fillText(c.b[1], W/2+232, 856);
    x.fillStyle='#6b7d8f'; x.font='400 30px '+CARD_FONT; x.fillText('таным зертханасы · cognitive lab', W/2, 985);
    cv.toBlob(b=>resolve(b),'image/png');
  });
}
async function shareResult(){
  const m=current.meta(); const c=current.card(lastSummary);
  const txt=`SplitSecond — ${m.name}: ${c.big} (${c.bigLabel}). ${lang==='kz'?'Өзіңдікін өлшеп көр!':'Проверь свою!'}`;
  try{
    const blob=await makeCardBlob();
    const file=new File([blob],'splitsecond-result.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text:txt, title:'SplitSecond'}); return;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='splitsecond-result.png';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast(U().imgSaved);
  }catch(e){ navigator.clipboard?.writeText(txt).then(()=>toast(U().copied), ()=>{}); }
}

/* ---- language ---- */
function repaintCurrentScreen(){
  const sc=document.body.dataset.screen;
  if(sc==='hub') renderHub();
  else if(sc==='intro' && current) openIntro(current.id);
  else if(sc==='results' && current){
    $('resTitle').textContent=current.meta().resTitle;
    $('again').textContent=U().again; $('share').textContent=U().share;
    $('download').textContent=U().download; $('toHub').textContent=U().toHub;
    current.renderResults(lastSummary, lastLog, $('resBody'));
  }
  else if(sc==='profile') openProfile();
}
function setLang(l){
  if(document.body.dataset.screen==='task') return;   // never switch mid-run
  lang=l;
  for(const b of document.querySelectorAll('.lang button')) b.classList.toggle('active', b.dataset.lang===l);
  document.documentElement.lang=(l==='kz'?'kk':'ru');
  $('tagline').textContent=U().tagline;
  $('footer').textContent=U().footer;
  repaintCurrentScreen();
}

/* ---- wiring ---- */
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
$('brand').addEventListener('click', goHub);
$('openProfile').addEventListener('click', openProfile);
$('hubDownload').addEventListener('click', downloadBatteryCSV);
$('start').addEventListener('click', beginTask);
$('introBack').addEventListener('click', goHub);
$('again').addEventListener('click', ()=>openIntro(current.id));
$('share').addEventListener('click', shareResult);
$('download').addEventListener('click', downloadCurrentCSV);
$('toHub').addEventListener('click', goHub);
$('quit').addEventListener('click', goHub);
$('profDownload').addEventListener('click', downloadBatteryCSV);
$('profBack').addEventListener('click', goHub);
window.addEventListener('keydown', e=>{
  if(document.body.dataset.screen!=='task' || !current) return;
  // task-specific keyboard:
  if(current.id==='stroop' && ['1','2','3','4'].includes(e.key)){ e.preventDefault(); document.querySelectorAll('#controls .answers button, #controls button')[+e.key-1]?.click(); }
  if((current.id==='gng'||current.id==='rt') && (e.code==='Space'||e.key===' ')){ e.preventDefault(); $('controls').querySelector('.bigbtn')?.click(); }
  if(current.id==='span' && /^[0-9]$/.test(e.key)){ $('controls').querySelector(`.keypad button[data-k="${e.key}"]`)?.click(); }
  if(current.id==='span' && (e.key==='Backspace')){ e.preventDefault(); $('controls').querySelector('.keypad button[data-k="del"]')?.click(); }
  if(current.id==='span' && (e.key==='Enter')){ e.preventDefault(); $('controls').querySelector('.keypad button[data-k="ok"]')?.click(); }
});

/* boot */
setLang('kz');
goHub();
</script>
