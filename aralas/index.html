<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aralas — тіл таңбаң / твой языковой отпечаток</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a12; --ink:#eef2fb; --ts:#aeb8cc; --tm:#6f7a90;
    --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
    --glass:rgba(255,255,255,.05);
    --kz:#2dd4bf; --ru:#8b5cf6; --amb:#f5b942; --lat:#38bdf8;
    --kz-bg:rgba(45,212,191,.16); --ru-bg:rgba(139,92,246,.18); --amb-bg:rgba(245,185,66,.16); --lat-bg:rgba(56,189,248,.16);
    --grad:linear-gradient(135deg,#2dd4bf 0%,#6d6ef4 52%,#a855f7 100%);
    --shadow:0 24px 60px rgba(0,0,0,.5); --r:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);
    line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
    padding:0 18px calc(50px + env(safe-area-inset-bottom));
    background:
      radial-gradient(900px 520px at 8% -8%, rgba(45,212,191,.18), transparent 58%),
      radial-gradient(860px 560px at 100% 4%, rgba(168,85,247,.20), transparent 55%),
      radial-gradient(700px 700px at 50% 120%, rgba(109,110,244,.14), transparent 55%),
      linear-gradient(180deg,#080b13,var(--bg) 55%,#06080f);
    background-attachment:fixed;}
  .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
  .orb1{top:-16%;left:-8%;width:560px;height:560px;background:radial-gradient(circle,rgba(45,212,191,.5),transparent 70%);animation:drift 24s ease-in-out infinite}
  .orb2{bottom:-18%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(168,85,247,.45),transparent 70%);animation:drift 29s ease-in-out infinite 5s}
  @keyframes drift{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-40px) scale(1.07)}}
  @media(prefers-reduced-motion:reduce){.orb{animation:none}}
  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:24px 2px 60px}
  .num{font-variant-numeric:tabular-nums}

  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:12px}
  .glyph{width:42px;height:42px;border-radius:13px;background:var(--grad);box-shadow:0 8px 22px rgba(109,110,244,.5);position:relative;flex:none}
  .glyph::after{content:"Aa";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#06121a}
  .bname{font-size:23px;font-weight:900;letter-spacing:-.03em;line-height:1}
  .btag{font-size:11.5px;color:var(--tm);margin-top:3px}
  .seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:50px;padding:3px;backdrop-filter:blur(10px)}
  .seg button{font:inherit;font-size:13px;font-weight:700;border:none;background:none;color:var(--ts);padding:7px 14px;border-radius:50px;cursor:pointer;transition:.18s}
  .seg button.on{background:var(--grad);color:#06121a}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;
    backdrop-filter:blur(14px);box-shadow:var(--shadow)}
  .hero .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--kz);margin-bottom:12px}
  h1{font-size:clamp(28px,5.4vw,42px);font-weight:900;line-height:1.05;letter-spacing:-.035em;margin-bottom:12px}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .lead{color:var(--ts);font-size:15.5px;margin-bottom:18px}
  .ta{font:inherit;font-size:16px;font-weight:500;width:100%;min-height:130px;resize:vertical;
    background:rgba(0,0,0,.28);border:1px solid var(--line2);border-radius:14px;padding:15px 16px;color:var(--ink);line-height:1.6}
  .ta:focus{outline:none;border-color:var(--kz);box-shadow:0 0 0 3px rgba(45,212,191,.2)}
  .samples{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  .samples .sl{font-size:11px;color:var(--tm);font-weight:700;text-transform:uppercase;letter-spacing:.08em;align-self:center;margin-right:2px}
  .sc{font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ts);background:var(--glass);
    border:1px solid var(--line);border-radius:50px;padding:7px 14px;transition:.15s}
  .sc:hover{color:var(--ink);border-color:var(--line2);transform:translateY(-1px)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .btn{font:inherit;font-weight:800;border:none;border-radius:14px;cursor:pointer;transition:transform .12s,filter .12s,box-shadow .12s;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--grad);color:#06121a;padding:15px 26px;font-size:16px;box-shadow:0 12px 30px -10px rgba(109,110,244,.8)}
  .btn-primary:hover{transform:translateY(-2px);filter:brightness(1.06)}
  .btn-primary:active{transform:scale(.98)}
  .btn-ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line2);padding:14px 18px;font-weight:700}
  .btn-ghost:hover{border-color:var(--tm)}

  .results{margin-top:16px;display:none}
  .results.on{display:block;animation:fade .5s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .sectlbl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--tm);font-weight:800;margin-bottom:12px}

  /* fingerprint */
  .fp{font-size:18px;line-height:2;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;word-break:break-word}
  .w{border-radius:6px;padding:1px 3px;transition:background .3s}
  .w.kz{background:var(--kz-bg);color:#8ff3e6}
  .w.ru{background:var(--ru-bg);color:#c9b6fb}
  .w.amb{background:var(--amb-bg);color:#f6d38a}
  .w.lat{background:var(--lat-bg);color:#a7ddfb}
  .key{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ts)}
  .key span{display:inline-flex;align-items:center;gap:6px}
  .key i{width:11px;height:11px;border-radius:4px;display:inline-block}

  /* metric tiles */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
  @media(max-width:520px){.tiles{grid-template-columns:1fr}}
  .tile{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:18px}
  .tile .n{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1}
  .tile .l{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tm);margin-top:8px}

  /* mix bars */
  .bars{margin:6px 0}
  .brow{display:grid;grid-template-columns:112px 1fr 48px;align-items:center;gap:12px;margin:9px 0;font-size:13.5px}
  .brow .nm{color:var(--ts);font-weight:600}
  .brow .tk{height:14px;border-radius:8px;background:rgba(0,0,0,.34);overflow:hidden}
  .brow .fl{height:100%;border-radius:8px;width:0;transition:width .8s cubic-bezier(.4,0,.2,1)}
  .brow .vv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

  .verdict{border-radius:var(--r);padding:20px 22px;margin-top:16px;border:1px solid var(--line2);
    background:linear-gradient(135deg,rgba(45,212,191,.1),rgba(168,85,247,.1))}
  .verdict .vt{font-size:22px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
  .verdict .vd{color:var(--ts);font-size:14.5px}

  details.exp{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  details.exp summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--kz)}
  details.exp summary::-webkit-details-marker{display:none}
  details.exp summary::before{content:"▸";transition:.2s;display:inline-block}
  details.exp[open] summary::before{transform:rotate(90deg)}
  details.exp p{color:var(--tm);font-size:13px;margin-top:10px;line-height:1.6}
  details.exp b{color:var(--ts)}
  footer{text-align:center;color:var(--tm);font-size:11.5px;padding:26px 0 6px}
  footer b{color:var(--ts)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(15,20,30,.95);
    border:1px solid var(--line2);color:var(--ink);padding:12px 20px;border-radius:50px;font-size:13.5px;font-weight:700;
    opacity:0;transition:.2s;pointer-events:none;z-index:20;backdrop-filter:blur(10px)}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="aurora"><div class="orb orb1"></div><div class="orb orb2"></div></div>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="glyph"></div><div><div class="bname">Aralas</div><div class="btag" id="tag"></div></div></div>
    <div class="seg"><button data-l="kz" class="on">ҚАЗ</button><button data-l="ru">РУС</button></div>
  </div>

  <section class="card hero">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <textarea class="ta" id="ta" spellcheck="false"></textarea>
    <div class="samples" id="samples"></div>
    <div class="row">
      <button class="btn btn-primary" id="go"></button>
      <button class="btn btn-ghost" id="clr"></button>
    </div>
  </section>

  <section class="results" id="results">
    <div class="card">
      <div class="sectlbl" id="fpLbl"></div>
      <div class="fp" id="fp"></div>
      <div class="key" id="key"></div>

      <div class="tiles">
        <div class="tile"><div class="n" id="mDom">—</div><div class="l" id="lDom"></div></div>
        <div class="tile"><div class="n" id="mSwitch">—</div><div class="l" id="lSwitch"></div></div>
        <div class="tile"><div class="n" id="mWords">—</div><div class="l" id="lWords"></div></div>
      </div>

      <div class="sectlbl" id="mixLbl"></div>
      <div class="bars" id="bars"></div>

      <div class="verdict"><div class="vt" id="vTitle"></div><div class="vd" id="vDesc"></div></div>

      <div class="row">
        <button class="btn btn-primary" id="share"></button>
        <button class="btn btn-ghost" id="again"></button>
      </div>

      <details class="exp"><summary id="expS"></summary><p id="expB"></p></details>
    </div>
  </section>

  <footer id="footer"></footer>
</div>
<div class="toast" id="toast"></div>
<canvas id="cardCanvas" width="1080" height="1080" style="display:none"></canvas>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
let lang="kz";

/* ---------- language detection (heuristic, honest) ----------
   Kazakh and Russian share the Cyrillic alphabet, and in real life Kazakhs very
   often type Kazakh WITHOUT its 9 special letters (қ->к, ғ->г, ң->н, ө->о, ұ/ү->у,
   ә->а, і->и, һ->х): "жақсы"->"жаксы", "күн"->"кун", "үйге"->"уйге". A naive detector
   calls those Russian or "shared"; Aralas is built so reduced-spelling Kazakh is
   still recognised as Kazakh. Each word is scored on several signals:
     1) the 9 unique Kazakh letters (ә ғ қ ң ө ұ ү һ і)          -> definitely Kazakh
     2) Russian-only letters (ё ъ э)                             -> definitely Russian
     3) a Kazakh lexicon matched in BOTH proper and reduced (letter-folded) form
     4) morphology: a Kazakh ROOT + a Kazakh ending (кел+ди, бар+ды) -> Kazakh, while
        Russian look-alikes (заво+ды, наро+ды) fail because the stem is not a root
     5) a lexicon of very common Russian words + Russian endings  -> Russian
   The strongest signal wins; a genuine tie stays "shared". An honest estimate, not truth. */
const KZ_LETTERS=/[әғқңөұүһі]/;
const RU_ONLY=/[ёъэ]/;                 // ё ъ э are Russian-only in practice (щ stays: ащы/тұщы are native Kazakh)
const NON_KZ=/[вфц]/g;                  // в ф ц occur in Kazakh only via Russian loanwords
const KZ_FOLD={"ә":"а","ғ":"г","қ":"к","ң":"н","ө":"о","ұ":"у","ү":"у","һ":"х","і":"и"};
const reduce=s=>s.replace(/[әғқңөұүһі]/g,c=>KZ_FOLD[c]);   // fold the 9 special letters to bare look-alikes
const LATIN=/[a-z]/i, CYR=/[а-яёәғқңөұүһі]/i;
const RU_WORDS=new Set(("и в не что это как я ты он она оно мы вы они был была было были если когда где для из по за до но а же бы ли уже ещё еще очень тоже потому чтобы который которая сейчас тогда здесь там всё все так вот да нет можно нужно надо хочу хочет будет есть меня тебя его её ее нас вас их мне тебе ему ей нам вам им себя свой своя мой моя твой наш ваш этот эта эти тот та те кто чей чем чём про над под при без через между более менее самый просто конечно спасибо привет пока хорошо плохо потом сегодня завтра вчера сколько почему зачем куда откуда или либо значит наверное кажется вообще именно даже почти чуть снова опять всегда никогда иногда часто редко много мало тут туда сюда сам сама сами свои этого этому только лишь пусть давай ладно окей блин типа короче вроде похоже была было будут будем буду можешь может нельзя должен должна хотя пока сразу теперь потому-что нибудь-то").split(" "));
const KZ_WORDS=new Set(("мен сен ол біз сіз бар жоқ деп сол осы мына ана бұл ма ба па ме бе пе да де та те ғой керек емес болады болды енді тағы содан сосын себебі өйткені сияқты туралы үшін менен сенен одан маған саған оған бізге сізге ол ма деген дейін кейін бойынша арқылы жайлы қой ғана тек әлі әрине рахмет сәлем қалай неге қашан қайда қанша жақсы жаман бүгін ертең кеше еді екен болатын болсын мынау анау сонау дегенмен бірақ солай былай осылай ешкім ешнәрсе барлығы бәрі кейбір біреу әркім әрбір бірнеше сондықтан иә ия жарайды дейді деді дейміз менің сенің оның біздің сіздің жаңа ескі үлкен кіші жақын алыс уақыт адам бала үй мектеп жыл түн таң кеш апта ай ертеңгі бүгінгі кешегі мұнда сонда осында қайдан неше сонымен яғни әсіресе тіпті мүлдем әрдайым кейде жиі сирек көп аз ия жарайды рас өтірік дұрыс бұрыс").split(" "));

/* extra vocabulary layered onto the base lexicons above */
"школа школе школу школы тема темы темасы успел успела успею успеешь дела делать день дней года время работа работе работать мама папа брат сестра друг город улица улицы деньги ничего страны весны команда правда секунда города заводы народ".split(" ").forEach(w=>RU_WORDS.add(w));
"күн күндер мұғалім ұстаз оқушы сабақ тақырып тапсырма үй қала дала жол ел халық тіл қазақ қазақша орыс орысша ағылшын дос апа аға іні қарындас әке шеше бауыр отбасы кітап дәптер қалам сынып емтихан баға білім оқу жазу сөз сөйлем сұрақ жауап жұмыс ақша нан су сүт шай ет тамақ асхана дүкен дәрігер аурухана ауыл қазір керемет тамаша маңызды қиын оңай жаңадан бұрын уақытында барлық".split(" ").forEach(w=>KZ_WORDS.add(w));

/* folded lexicon + Kazakh roots power the reduced-spelling & morphology matching */
const KZ_REDUCED=new Set(); KZ_WORDS.forEach(w=>KZ_REDUCED.add(reduce(w)));
const KZ_ROOTS=new Set(("кел кет бар бер айт де кор бил окы жаз ойна жур тур отыр жат кара тында сойле жаса исте кыл бол ал сал аш жап кир шык кайт тус тусин тусиндир таста битир баста аякта апар акел сура кол жет улгер кездес кой иш же уйрен уйрет байка тап тусир жибер унат карай ойла").split(" "));
KZ_WORDS.forEach(w=>KZ_ROOTS.add(reduce(w)));   // every lexicon word is a valid stem too

/* Kazakh endings (folded), longest-first, stripped one or twice to test root+ending forms */
const STRIP=("майды мейди байды бейди пайды пейди атын етин йтын йтин тирди дирди динди сынды синди "+
 "дым дим тым тим дык дик тык тик мын мин сын син сыз сиз мыз миз быз биз лар лер дар дер тар тер "+
 "нын нин дын дин тын тин нан нен дан ден тан тен нда нде ган ген кан кен ады еди йды йди уда уде "+
 "ныки ники дай дей тай тей пен бен мен шы ши ды ди ты ти ны ни га ге ка ке са се сы си ым им ын ин ып ип ак ек у")
 .split(" ").sort((a,b)=>b.length-a.length);

function stemIsKazakh(f){
  if(KZ_ROOTS.has(f)||KZ_REDUCED.has(f)) return true;
  for(const suf of STRIP){
    if(f.length>suf.length+1 && f.endsWith(suf)){
      const stem=f.slice(0,-suf.length);
      if(KZ_ROOTS.has(stem)||KZ_REDUCED.has(stem)) return true;
      for(const s2 of STRIP){                              // root + derivation + inflection (тусин+дир+ди)
        if(stem.length>s2.length+1 && stem.endsWith(s2) && KZ_ROOTS.has(stem.slice(0,-s2.length))) return true;
      }
    }
  }
  return false;
}

const KZ_SUF_STRONG=/(ған|ген|қан|кен|тын|тін|атын|етін|майды|мейді|дым|дім|дим|тым|тім|тим|дың|дің|тың|тің|мын|мін|сың|сің|сыз|сіз|мыз|міз|быз|біз|дай|дей|тай|тей|дар|дер|тар|тер|лар|лер|нан|нен|дан|ден|тан|тен|ныкі|нікі)$/;
const RU_SUF=/(ый|ий|ого|его|ому|ему|ыми|ими|ость|ется|ится|ешь|ишь|ают|яют|уют|ует|ился|илась|аешь|уешь|ает)$/;

/* Weighted, honest classifier: strongest Kazakh-vs-Russian signal wins; a real tie stays "shared". */
function classify(w){
  const lw=w.toLowerCase().replace(/[’']/g,"");
  if(LATIN.test(w)&&!CYR.test(w)) return "lat";
  if(!CYR.test(lw)) return "amb";
  if(KZ_LETTERS.test(lw)) return "kz";      // a unique Kazakh letter is decisive
  if(RU_ONLY.test(lw))    return "ru";      // ё ъ э are decisive for Russian

  let kz=0, ru=0; const f=reduce(lw);
  if(RU_WORDS.has(lw))                    ru+=60;
  if(KZ_WORDS.has(lw)||KZ_REDUCED.has(f)) kz+=60;   // exact / reduced-spelling lexicon hit
  else if(stemIsKazakh(f))                kz+=40;    // Kazakh root + Kazakh ending (morphology)
  if(KZ_SUF_STRONG.test(lw))              kz+=20;
  if(RU_SUF.test(lw))                     ru+=26;
  const nk=(lw.match(NON_KZ)||[]).length; if(nk) ru+=8+nk*4;

  if(kz===0&&ru===0) return "amb";
  if(kz-ru>=12) return "kz";
  if(ru-kz>=12) return "ru";
  return "amb";
}
function tokenize(text){
  const re=/([A-Za-zА-Яа-яЁёӘҒҚҢӨҰҮҺІәғқңөұүһі’']+)|([^A-Za-zА-Яа-яЁёӘҒҚҢӨҰҮҺІәғқңөұүһі’']+)/g;
  const out=[]; let m;
  while((m=re.exec(text))!==null){
    if(m[1]!=null) out.push({t:m[1],word:true,cat:classify(m[1])});
    else out.push({t:m[2],word:false});
  }
  return out;
}
function analyze(text){
  const toks=tokenize(text);
  const words=toks.filter(t=>t.word);
  const c={kz:0,ru:0,amb:0,lat:0};
  words.forEach(w=>c[w.cat]++);
  const W=words.length||1;
  // code-switch rate: among adjacent Kazakh/Russian words, % that flip language
  const seq=words.filter(w=>w.cat==="kz"||w.cat==="ru").map(w=>w.cat);
  let sw=0; for(let i=1;i<seq.length;i++) if(seq[i]!==seq[i-1]) sw++;
  const switchRate= seq.length>1 ? Math.round(sw/(seq.length-1)*100) : 0;
  const ident=c.kz+c.ru;
  const kzShare=ident?Math.round(c.kz/ident*100):0;
  const ruShare=ident?100-kzShare:0;
  return {toks,words:W,c,pct:{kz:Math.round(c.kz/W*100),ru:Math.round(c.ru/W*100),amb:Math.round(c.amb/W*100),lat:Math.round(c.lat/W*100)},switchRate,bilingual:seq.length,ident,kzShare,ruShare};
}

/* ---------- render ---------- */
let last=null;
function paintStatic(){
  const x=t();
  $("tag").textContent=x.tag;
  $("eyebrow").textContent=x.eyebrow;
  $("h1").innerHTML=x.h1[0]+'<span class="grad-text">'+x.h1grad+'</span>'+x.h1[1];
  $("lead").textContent=x.lead;
  $("go").textContent=x.go; $("clr").textContent=x.clr;
  $("ta").placeholder = lang==="kz" ? "Осы жерге өзің қалай жазатыныңды таста…" : "Вставь сюда, как ты обычно пишешь…";
  const sb=$("samples"); sb.innerHTML='<span class="sl">'+x.samplesL+'</span>';
  x.samples.forEach(([label,text])=>{const b=document.createElement("button");b.className="sc";b.textContent=label;b.onclick=()=>{$("ta").value=text;run();};sb.appendChild(b);});
  $("fpLbl").textContent=x.fpLbl; $("mixLbl").textContent=x.mixLbl;
  $("lDom").textContent=x.lDom; $("lSwitch").textContent=x.lSwitch; $("lWords").textContent=x.lWords;
  $("share").textContent=x.share; $("again").textContent=x.again;
  $("expS").textContent=x.expS; $("expB").textContent=x.expB;
  $("footer").innerHTML=x.footer;
  const k=x.key; $("key").innerHTML=
    `<span><i style="background:var(--kz)"></i>${k.kz}</span><span><i style="background:var(--ru)"></i>${k.ru}</span><span><i style="background:var(--amb)"></i>${k.amb}</span><span><i style="background:var(--lat)"></i>${k.lat}</span>`;
}
function toast(m){const el=$("toast");el.textContent=m;el.classList.add("on");setTimeout(()=>el.classList.remove("on"),1500);}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function verdict(a){
  const x=t().verdict;
  // decide from the Kazakh-vs-Russian ratio among IDENTIFIABLE words, not % of total
  if(a.ident < Math.max(3, a.words*0.12)) return x.mix;   // too little we can tell apart
  if(a.switchRate>=28 && a.kzShare>=25 && a.ruShare>=25) return x.heavy;
  if(a.kzShare>=70) return x.kz;
  if(a.ruShare>=65) return x.ru;
  if(a.kzShare>=30 && a.ruShare>=30) return x.bal;
  return x.mix;
}
function domLang(a){const x=t().dom;if(a.ident<3)return x.none;if(Math.abs(a.kzShare-a.ruShare)<16)return x.mix;return a.kzShare>=a.ruShare?x.kz:x.ru;}

function run(){
  const text=$("ta").value.trim();
  if(text.split(/\s+/).filter(Boolean).length<2){toast(t().needMore);return;}
  const a=analyze(text); last=a;
  // fingerprint
  $("fp").innerHTML=a.toks.map(tk=>tk.word?`<span class="w ${tk.cat}">${esc(tk.t)}</span>`:esc(tk.t)).join("");
  // tiles
  $("mDom").textContent=domLang(a);
  $("mSwitch").textContent=a.switchRate+"%";
  $("mWords").textContent=a.words;
  // color the switch tile by intensity
  $("mSwitch").style.color = a.switchRate>=28?"var(--amb)":(a.switchRate>=12?"var(--kz)":"var(--ts)");
  // bars
  const x=t();
  const rows=[["nmKz",a.pct.kz,"var(--kz)"],["nmRu",a.pct.ru,"var(--ru)"],["nmAmb",a.pct.amb,"var(--amb)"],["nmLat",a.pct.lat,"var(--lat)"]];
  $("bars").innerHTML=rows.map(([k,v,c])=>`<div class="brow"><span class="nm">${x[k]}</span><span class="tk"><span class="fl" data-w="${v}" style="background:${c}"></span></span><span class="vv">${v}%</span></div>`).join("");
  requestAnimationFrame(()=>document.querySelectorAll(".fl").forEach(f=>f.style.width=f.dataset.w+"%"));
  // verdict
  const vd=verdict(a); $("vTitle").textContent=vd[0]; $("vDesc").textContent=vd[1];
  $("results").classList.add("on");
  $("results").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------- share card ---------- */
function shareCard(){
  if(!last){return;}
  const a=last,x=t(),c=$("cardCanvas"),g=c.getContext("2d"),W=1080,H=1080,F="'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif";
  g.fillStyle="#070a12";g.fillRect(0,0,W,H);
  const bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,"rgba(45,212,191,.30)");bg.addColorStop(.55,"rgba(109,110,244,.16)");bg.addColorStop(1,"rgba(168,85,247,.24)");g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.fillStyle="#0c1019";g.strokeStyle="rgba(255,255,255,.14)";g.lineWidth=3;g.beginPath();g.roundRect(60,60,W-120,H-120,44);g.fill();g.stroke();
  g.textAlign="center";
  g.fillStyle="#2dd4bf";g.font="800 42px "+F;g.fillText("ARALAS",W/2,175);
  g.fillStyle="#aeb8cc";g.font="500 30px "+F;g.fillText(x.tag,W/2,222);
  const vd=verdict(a);
  g.fillStyle="#ffffff";g.font="900 60px "+F;wrapText(g,vd[0],W/2,340,W-220,66);
  // three big numbers
  const cells=[[a.kzShare+"%",x.nmKz,"#2dd4bf"],[a.switchRate+"%",x.lSwitch,"#f5b942"],[a.ruShare+"%",x.nmRu,"#a855f7"]];
  cells.forEach((cl,i)=>{const cx=W/2+(i-1)*300;g.fillStyle=cl[2];g.font="900 100px "+F;g.fillText(cl[0],cx,600);
    g.fillStyle="#aeb8cc";g.font="500 30px "+F;g.fillText(cl[1],cx,650);});
  // mini stacked bar
  const bx=170,bw=W-340,by=720,bh=34;const seg=[[a.pct.kz,"#2dd4bf"],[a.pct.ru,"#a855f7"],[a.pct.amb,"#f5b942"],[a.pct.lat,"#38bdf8"]];
  let cur=bx;g.save();roundRectPath(g,bx,by,bw,bh,17);g.clip();seg.forEach(s=>{const w=bw*s[0]/100;g.fillStyle=s[1];g.fillRect(cur,by,w+1,bh);cur+=w;});g.restore();
  g.fillStyle="#6f7a90";g.font="400 30px "+F;g.fillText(lang==="kz"?"өз тіл таңбаңды өлше →":"измерь свой отпечаток →",W/2,860);
  g.fillStyle="#8892a6";g.font="600 30px "+F;g.fillText("aralas",W/2,960);
  c.toBlob(b=>{const file=new File([b],"aralas.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Aralas"}).catch(()=>{});return;}
    const aEl=document.createElement("a");aEl.href=URL.createObjectURL(b);aEl.download="aralas.png";document.body.appendChild(aEl);aEl.click();aEl.remove();toast(x.saved);},"image/png");
}
function roundRectPath(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function wrapText(g,text,cx,y,maxW,lh){const words=text.split(" ");let line="",yy=y;words.forEach(w=>{const test=line?line+" "+w:w;if(g.measureText(test).width>maxW&&line){g.fillText(line,cx,yy);line=w;yy+=lh;}else line=test;});g.fillText(line,cx,yy);}

/* ---------- wire ---------- */
$("go").onclick=run;
$("again").onclick=()=>{$("results").classList.remove("on");$("ta").focus();};
$("clr").onclick=()=>{$("ta").value="";$("results").classList.remove("on");$("ta").focus();};
$("share").onclick=shareCard;
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  lang=b.dataset.l;document.documentElement.lang=lang==="kz"?"kk":"ru";
  document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));
  paintStatic(); if(last&&$("results").classList.contains("on")) run();
});
paintStatic();
})();
